<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080607">
    <meta name="description" content="Gather the players before the first bell rings.">
    <title>Gather the Players | Blood on the Halloween Clocktower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        --ink: #080607;
        --blood: #ed1833;
        --paper: #e6d8cf;
        --muted: #a29591;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 2rem 1.25rem;
        color: var(--paper);
        background: radial-gradient(ellipse at 50% 39%, rgb(89 12 24 / 22%), transparent 46%), var(--ink);
        font-family: "IM Fell English", Georgia, serif;
      }

      .card {
        width: min(100%, 38rem);
        padding: clamp(2rem, 7vw, 4.5rem);
        border: 1px solid #48212a;
        background: rgb(15 10 12 / 88%);
        box-shadow: 0 0 70px rgb(133 8 29 / 16%), inset 0 0 50px rgb(80 15 27 / 10%);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #c1a8a1;
        font-size: .75rem;
        letter-spacing: .3em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: var(--blood);
        font-family: "Creepster", "Impact", fantasy;
        font-size: clamp(3.2rem, 11vw, 5.6rem);
        font-weight: 400;
        line-height: .95;
        text-shadow: 0 2px 0 #9a081c, 0 5px 24px rgb(235 19 47 / 32%);
      }

      .rule {
        margin: 1.5rem 0;
        color: #9e2533;
      }

      .intro {
        margin: 0 auto 2rem;
        color: var(--muted);
        font-size: 1.15rem;
        font-style: italic;
        line-height: 1.7;
      }

      .name-form {
        display: grid;
        gap: 1rem;
        width: 100%;
        margin: 0 auto 1.4rem;
      }

      .entry-field {
        display: grid;
        gap: .4rem;
        text-align: left;
      }

      .entry-field label {
        color: #c1a8a1;
        font-size: .75rem;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      .name-input {
        min-width: 0;
        width: 100%;
        padding: .9rem 1rem;
        border: 1px solid #68404a;
        border-radius: 0;
        color: var(--paper);
        background: #100b0e;
        font: 1rem "IM Fell English", Georgia, serif;
      }

      .name-input::placeholder { color: #76686a; }
      .name-input:focus-visible { outline: 2px solid var(--blood); outline-offset: 2px; }

      .done {
        padding: .8rem 1rem;
        border: 1px solid #f04a59;
        border-radius: 0;
        color: #fff1ed;
        background: #78091c;
        cursor: pointer;
        font: .82rem "IM Fell English", Georgia, serif;
        letter-spacing: .14em;
      }

      .done:hover { background: #a40c23; }
      .done:focus-visible { outline: 2px solid #ffe4dc; outline-offset: 3px; }

      .chooser-row {
        display: flex;
        gap: .65rem;
      }

      .chooser-row .name-input { flex: 1; }

      .victim-count {
        margin: 0 0 1.5rem;
        color: #76686a;
        font-size: .9rem;
        font-style: italic;
      }

      .back {
        display: inline-block;
        padding: .85rem 1.4rem;
        border: 1px solid #9f2636;
        color: #fff1ed;
        background: #78091c;
        font-size: .82rem;
        letter-spacing: .18em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .back:hover { background: #a40c23; }
      .back:focus-visible { outline: 2px solid #ffe4dc; outline-offset: 5px; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">*insert screaming noises here*</p>
      <h1>Gather the names</h1>
      <p class="rule" aria-hidden="true">✦ &nbsp; ✦ &nbsp; ✦</p>
      <p class="intro">Choose the soul you wish to damn, and enter your own name.</p>
      <form class="name-form" id="name-form">
        <div class="entry-field">
          <label for="victim-input">Your victim</label>
          <input class="name-input" id="victim-input" name="victim" type="text" placeholder="Enter a victim's name..." autocomplete="off" required>
        </div>
        <div class="entry-field">
          <label for="chooser-input">Your name</label>
          <div class="chooser-row">
            <input class="name-input" id="chooser-input" name="chooser" type="text" placeholder="Enter your name..." autocomplete="off" required>
            <button class="done" type="submit">DONE</button>
          </div>
        </div>
      </form>
      <p class="victim-count" id="victim-count" aria-live="polite"></p>
      <a class="back" href="victim.html">ALL VICTIMS ENTERED</a>
    </main>
    <script>
      const storageKey = "bloodOnTheHalloweenClocktower.names";
      const chooserStorageKey = "bloodOnTheHalloweenClocktower.choosers";
      const form = document.querySelector("#name-form");
      const victimInput = document.querySelector("#victim-input");
      const chooserInput = document.querySelector("#chooser-input");
      const countMessage = document.querySelector("#victim-count");
      const names = JSON.parse(localStorage.getItem(storageKey) || "[]");
      const choosers = JSON.parse(localStorage.getItem(chooserStorageKey) || "[]");

      function renderCount() {
        const count = names.length;
        countMessage.textContent = count === 1
          ? "1 person has chosen a victim."
          : `${count} people have chosen their victims.`;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const victim = victimInput.value.trim();
        const chooser = chooserInput.value.trim();
        if (!victim || !chooser) {
          (victim ? chooserInput : victimInput).focus();
          return;
        }
        names.push(victim);
        choosers.push(chooser);
        localStorage.setItem(storageKey, JSON.stringify(names));
        localStorage.setItem(chooserStorageKey, JSON.stringify(choosers));
        renderCount();
        form.reset();
        victimInput.focus();
      });

      renderCount();
    </script>
  </body>
</html>
